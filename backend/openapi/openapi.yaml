openapi: 3.1.0
info:
  title: VibeCheck API
  version: 0.1.0
  description: Photo analysis API for VibeCheck. Style scoring runs only after consent and AI feature extraction.
servers:
  - url: http://localhost:8080/api
paths:
  /healthz:
    get:
      operationId: health
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
  /readyz:
    get:
      operationId: ready
      responses:
        '200':
          description: AI is configured with a reachable optional Redis budget, or private presets are available. Does not validate AI credentials or remaining budget.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: No available path (missing AI configuration or unreachable Redis, and no private presets).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
  /v1/analyses:
    post:
      operationId: analyzeImage
      description: Sanitizes one JPEG or PNG in memory after explicit consent. Approved exact photos receive an owner-defined result after visual verification; other images go to the configured AI provider for outfit scoring. The image is not persisted by this server. Duplicate or unexpected fields are rejected.
      parameters:
        - in: header
          name: X-Request-ID
          schema: { type: string, minLength: 8, maxLength: 80 }
        - in: header
          name: Idempotency-Key
          description: Optional stable key for retries of the same photo. Kept in process memory for 10 minutes; reuse with a different image returns 409.
          schema: { type: string, minLength: 16, maxLength: 80, pattern: '^[A-Za-z0-9_-]+$' }
        - in: header
          name: X-Original-Image-SHA256
          description: Optional digest of the original file before browser compression. Owner-approved photos also require a visual match against the uploaded sanitized image before returning a preset result.
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [image, privacy_consent]
              properties:
                image:
                  type: string
                  format: binary
                privacy_consent:
                  type: boolean
                  description: Explicit consent to send the sanitized image to the configured external AI processor.
      responses:
        '200':
          description: Completed or low-confidence analysis. The uploaded image was not stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisResponse' }
        '400': { description: Invalid multipart request, duplicate or unexpected field. }
        '409': { description: Idempotency key was reused with a different image. }
        '413': { description: Request body is too large. }
        '415': { description: Only JPEG and PNG are supported. }
        '422': { description: Invalid image or AI refusal. }
        '429': { description: Per-client, hourly, or concurrency analysis limit reached. Includes Retry-After header. }
        '502': { description: AI returned an invalid contract. }
        '503': { description: AI provider is temporarily unavailable. }
components:
  responses:
    UnsupportedMediaType:
      description: Request must use multipart/form-data.
  schemas:
    Status:
      type: object
      required: [status]
      properties: { status: { type: string } }
    Readiness:
      type: object
      required: [status, ai_available, presets_available, shared_budget_configured, shared_budget_available]
      properties:
        status: { type: string }
        ai_available: { type: boolean }
        presets_available: { type: boolean }
        shared_budget_configured: { type: boolean }
        shared_budget_available: { type: boolean, description: 'True when no shared budget is required, or its non-consuming connectivity check succeeds.' }
    Score:
      type: integer
      minimum: 0
      maximum: 100
    Signals:
      type: object
      additionalProperties: false
      required: [goth, alternative, streetwear, classic, sport_chic]
      properties:
        goth: { $ref: '#/components/schemas/Score' }
        alternative: { $ref: '#/components/schemas/Score' }
        streetwear: { $ref: '#/components/schemas/Score' }
        classic: { $ref: '#/components/schemas/Score' }
        sport_chic: { $ref: '#/components/schemas/Score' }
        retro_90s: { $ref: '#/components/schemas/Score' }
    VisualFeatures:
      type: object
      additionalProperties: false
      required: [contract_version, dominant_colors, color_harmony, darkness, formality, sportiness, originality, outfit_coherence, accessory_intensity, layering, traditional_elements, image_quality, outfit_visibility, confidence, person_count, subculture_signals]
      properties:
        contract_version: { type: string, const: 1.0.0 }
        dominant_colors: { type: array, maxItems: 5, items: { type: string } }
        color_harmony: { $ref: '#/components/schemas/Score' }
        darkness: { $ref: '#/components/schemas/Score' }
        formality: { $ref: '#/components/schemas/Score' }
        sportiness: { $ref: '#/components/schemas/Score' }
        originality: { $ref: '#/components/schemas/Score' }
        outfit_coherence: { $ref: '#/components/schemas/Score' }
        accessory_intensity: { $ref: '#/components/schemas/Score' }
        layering: { $ref: '#/components/schemas/Score' }
        traditional_elements: { $ref: '#/components/schemas/Score' }
        image_quality: { $ref: '#/components/schemas/Score' }
        outfit_visibility: { $ref: '#/components/schemas/Score' }
        confidence: { $ref: '#/components/schemas/Score' }
        person_count: { type: integer, minimum: 0, maximum: 10 }
        skullcap_visible: { type: boolean, description: 'True only for a clearly visible skullcap on the main subject.' }
        beard_visible: { type: boolean, description: 'True only for a beard on the same subject; no religious or occupational inference.' }
        unnatural_hair_color_visible: { type: boolean, description: 'Clearly dyed non-natural hair color on the main subject.' }
        piercing_visible: { type: boolean, description: 'Clearly visible piercing on the main subject; excludes a single ordinary earring.' }
        hair_below_ears_visible: { type: boolean, description: 'Hair visibly extends below the ears; weak cue alone.' }
        hair_over_eyes_visible: { type: boolean, description: 'Hair visibly covers one or both eyes; weak cue alone.' }
        playful_grimace_visible: { type: boolean, description: 'Clearly deliberate playful grimace, not an ordinary smile or blink.' }
        subculture_signals: { $ref: '#/components/schemas/Signals' }
    CategoryScore:
      type: object
      required: [code, title, score]
      properties:
        code: { type: string }
        title: { type: string }
        score: { $ref: '#/components/schemas/Score' }
    ScoringResult:
      type: object
      required: [status, primary_category, secondary_category, level, level_title, score, confidence, metrics, summary, recommendations]
      properties:
        status: { type: string, enum: [completed, low_confidence] }
        primary_category: { $ref: '#/components/schemas/CategoryScore' }
        secondary_category: { $ref: '#/components/schemas/CategoryScore' }
        level: { type: string }
        level_title: { type: string }
        score: { $ref: '#/components/schemas/Score' }
        confidence: { $ref: '#/components/schemas/Score' }
        metrics: { type: object, additionalProperties: { $ref: '#/components/schemas/Score' } }
        summary: { type: string }
        recommendations: { type: array, items: { type: string } }
        explanations:
          type: array
          maxItems: 3
          items: { type: string }
          description: Visible cues contributing most to the selected category. Omitted when no grounded explanation is available, including manual presets.
        provisional: { type: boolean, description: Verdict is tentative because the image or visible evidence is limited. }
        assessment_note: { type: string, description: Short explanation of assessment limits. }
        assessment_scope:
          type: string
          enum: [portrait]
          description: Portrait-only verdict. Outfit score and metrics are zero placeholders and must not be displayed as ratings; level and secondary category are empty. Omitted for outfit assessments.
        low_confidence_reason: { type: string }
    AnalysisResponse:
      type: object
      required: [analysis_id, status, result, privacy]
      properties:
        analysis_id: { type: string }
        status: { type: string, enum: [completed, low_confidence] }
        result: { $ref: '#/components/schemas/ScoringResult' }
        privacy:
          type: object
          additionalProperties: false
          required: [server_image_stored]
          properties:
            server_image_stored: { type: boolean, const: false }
    ApiError:
      type: object
      required: [code, message, request_id, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
        retryable: { type: boolean }
