name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_TEST_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Go tests
        working-directory: backend
        run: go test -race ./...
      - name: Go vet
        working-directory: backend
        run: go vet ./...
      - name: Offline scoring evaluation
        working-directory: backend
        run: go run ./cmd/evaluate -input internal/evaluation/testdata/synthetic.json -expected-count 15
      - name: PWA JavaScript syntax
        run: |
          node --check dist/app.js
          node --check dist/history.js
          node --check dist/share-card.js
          node --check dist/sw.js
      - name: PWA release consistency and behavior
        run: |
          node scripts/build-pwa.mjs --check
          node --test tests/*.test.cjs
      - name: Production image build
        run: docker build --tag vibe-check:ci .
      - name: Deployment script regression checks
        shell: pwsh
        run: ./scripts/test-deployment.ps1
